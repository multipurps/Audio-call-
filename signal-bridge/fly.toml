app = "live-call-signal"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Secrets (fly secrets set ...): BRIDGE_SECRET, ASSISTANT_BRIDGE_URL, ASSISTANT_BRIDGE_SECRET,
# APP_API_URL, RELAY_CALLBACK_SECRET.  ASSISTANT_MODE=echo plays the caller's own voice back
# (audio-path test, no assistant).
[env]
  PORT = "8080"
  SIGNAL_DATA_DIR = "/data"
  ASSISTANT_MODE = "acaf"

[mounts]
  source = "signal_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
