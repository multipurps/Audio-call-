# Render Blueprint for the audio-call assistant (Pipecat) service.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo. Render
# reads the `rootDir` below, so the repo root does not need its own render.yaml
# (the existing `server/` and `server-social/` relays are configured in the
# dashboard and are deliberately not managed here -- adding them would risk
# changing how the working Twilio relay is built).
#
# This is a **Web Service**, not a Background Worker:
#   * it must accept inbound WebSocket connections from the PHP relay, and
#     Background Workers cannot accept inbound traffic at all;
#   * it exposes /healthz and /readyz, which Render's health checks and any
#     load balancer need to reach over HTTP.
#
# The free plan spins an instance down after inactivity. A cold start during a
# live call drops the call, so a paid always-on plan is required for anything
# beyond testing.

services:
  - type: web
    name: audio-call-assistant
    runtime: python
    plan: starter          # must be always-on; see the note above
    region: oregon
    rootDir: pipecat-service
    buildCommand: pip install -r requirements.txt
    # `python -m app.main` reads PORT from the environment itself and binds
    # 0.0.0.0, which Render requires (binding 127.0.0.1 is unreachable from
    # Render's proxy).
    startCommand: python -m app.main
    healthCheckPath: /healthz
    # Long-lived WebSocket connections need the longest graceful window the
    # plan allows: Render sends SIGTERM, and app/main.py's lifespan handler
    # uses that time to tell each in-flight carrier the call is ending.
    autoDeploy: true
    envVars:
      # --- Set these in the dashboard; placeholders only here --------------
      # Never commit real values. `sync: false` makes Render prompt for them
      # rather than reading them from this file.
      - key: ASSISTANT_BRIDGE_SECRET
        sync: false          # shared with mp-relay; generate with:
                             # python -c "import secrets;print(secrets.token_urlsafe(32))"
      # OpenAI covers STT (gpt-4o-mini-transcribe) and the LLM (gpt-6-luna).
      # LUNA_API_KEY may be set instead of / alongside OPENAI_API_KEY when
      # the operator keeps the Luna key separate; either satisfies the
      # validation. Groq was removed entirely — do not re-add GROQ_API_KEY.
      - key: OPENAI_API_KEY
        sync: false
      - key: LUNA_API_KEY
        sync: false
      - key: FISH_API_KEY
        sync: false

      # --- Non-secret configuration ---------------------------------------
      - key: ASSISTANT_STT_PROVIDER
        value: openai
      - key: ASSISTANT_LLM_PROVIDER
        value: luna
      - key: ASSISTANT_TTS_PROVIDER
        value: fish
      - key: ASSISTANT_BRIDGE_SAMPLE_RATE
        value: "16000"
      - key: ASSISTANT_IDLE_TIMEOUT_SECS
        value: "30"
      - key: ASSISTANT_HEARTBEAT_INTERVAL_SECS
        value: "10"
      - key: ASSISTANT_MAX_CALL_SECONDS
        value: "1800"
      # The provider's answer event (ACAF `call_active`) is the source of
      # truth for "the callee answered"; first inbound audio is NOT, so the
      # conversation timer cannot start while the phone is still ringing.
      # Set "true" only for a legacy relay that cannot send the answer event.
      - key: ASSISTANT_ANSWER_ON_FIRST_AUDIO
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Supabase creds power the call-context resolver (objective/person
      # prompt context), live transcript writes, and memory retrieval. Memory
      # RETRIEVAL additionally requires the opt-in flag below (storing user
      # data across calls is deliberate); the resolver itself only needs the
      # two creds. PUBLIC_APP_URL lets the service report a call's end back
      # through /api/social-calling when the carrier's own callback never
      # arrived, which is what triggers the shared summary for such calls:
      # SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are REQUIRED for real
      # calls: without them the call has no instructions, memory, live
      # transcript or summary (the service logs an ERROR per call).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ASSISTANT_ENABLE_PERSISTENT_MEMORY
        value: "true"
      #   - key: PUBLIC_APP_URL
      #     value: https://your-app.vercel.app
