<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0714">
<title>Emysa</title>
<link rel="icon" href="icon-192.png">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:#0d0714; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;}
  main{min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px 28px; gap:12px;}
  img{width:64px; height:64px; border-radius:18px; margin-bottom:10px;}
  h1{font-size:24px; font-weight:700; letter-spacing:-0.01em;}
  p{font-size:15px; line-height:1.5; color:rgba(228,214,255,.7); max-width:300px;}
  a{margin-top:18px; padding:14px 26px; border-radius:14px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); color:#fff; font-size:16px; font-weight:600; text-decoration:none;}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1 id="title">Thank you</h1>
  <p id="note">We are confirming your payment. Your minutes appear in Emysa within a moment.</p>
  <a href="./index.html">Back to Emysa</a>
</main>
<script>
  // This page only reports where you are. It never changes a balance: minutes
  // are added by Emysa's server after Bachs confirms the payment.
  if (new URLSearchParams(location.search).get('pay') === 'cancel') {
    document.getElementById('title').textContent = 'Payment cancelled';
    document.getElementById('note').textContent = 'You have not been charged. You can add time again from Home.';
  }
</script>
</body>
</html>
