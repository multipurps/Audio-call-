<!DOCTYPE html>
<html lang="en" data-theme="ss2">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0714">
<title>Emysa Admin</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="stylesheet" href="../styles.css">
<style>
  /* Admin is a single screen, no tab bar / call-screen chrome from the main app. */
  #adminApp{position:fixed; inset:0; overflow-y:auto; padding:0 18px 40px;}
  .adminHeader{padding-top:56px; margin-bottom:20px; text-align:center;}
  .adminHeader img{width:56px; height:56px; border-radius:16px; margin:0 auto 10px;}
  .bgGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .bgCard{position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--line); aspect-ratio:9/16; background:var(--panel);}
  .bgCard img{width:100%; height:100%; object-fit:cover; display:block;}
  .bgCard button{position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,0.6); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center;}
  .minuteLimitRow{display:flex; align-items:center; gap:6px; margin-top:8px;}
  .minuteLimitRow input{width:64px; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:#fff; font-size:13px; padding:6px 8px; text-align:center;}
  .minuteLimitRow button{font-size:11.5px; font-weight:650; padding:6px 10px; border-radius:8px; background:rgba(255,255,255,0.12); color:#fff;}
  .statRow{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .statRow .email{font-size:13.5px; font-weight:600; word-break:break-all;}
  .statRow .sub{font-size:11.5px; color:var(--dim); margin-top:2px;}
  .statRow .total{font-size:16px; font-weight:800; color:var(--accent); flex:none; text-align:right;}
</style>
</head>
<body>

<div id="authScreen">
  <div id="authBoot" style="margin:auto; text-align:center;">
    <div class="authLogo" style="background:var(--accent);"><img src="../icon-192.png" alt="" style="width:100%;height:100%;border-radius:20px;object-fit:cover;"></div>
  </div>

  <div id="authBox" style="display:none; margin:auto 0;">
    <div class="authLogo"><img src="../icon-192.png" alt="" style="width:100%;height:100%;border-radius:20px;object-fit:cover;"></div>
    <div class="authTitle">Emysa Admin</div>
    <div class="authSub">Sign in with the admin account.</div>

    <div class="field"><label>Email</label><input type="email" id="authEmail" autocomplete="email"></div>
    <div class="field"><label>Password</label><input type="password" id="authPassword" autocomplete="current-password"></div>
    <button class="primaryBtn" id="authSubmit">Sign in</button>
    <div class="authHint" id="authHint"></div>
  </div>

  <div id="notAdminBox" style="display:none; margin:auto 0; text-align:center;">
    <div class="authLogo"><img src="../icon-192.png" alt="" style="width:100%;height:100%;border-radius:20px;object-fit:cover;"></div>
    <div class="authTitle">Not an admin account</div>
    <p style="color:var(--dim); font-size:14.5px; margin:10px 0 24px;">This account isn't set as ADMIN_EMAIL.</p>
    <button class="secondaryBtn" id="notAdminSignOut">Sign out</button>
  </div>
</div>

<div id="adminApp" class="hidden">
  <div class="adminHeader">
    <img src="../icon-192.png" alt="">
    <h1 class="pageTitle" style="padding-top:0;">Emysa Admin</h1>
  </div>

  <div class="field">
    <label>Welcome, login &amp; signup backgrounds</label>
    <div style="font-size:12.5px; color:var(--dim); margin-bottom:10px;">Upload as many as you like — the app fades between them automatically.</div>
    <div class="bgGrid" id="bgGrid"></div>
    <button class="secondaryBtn" id="uploadBgBtn" style="margin-top:10px;">Add image</button>
    <input type="file" id="bgFileInput" accept="image/*" style="display:none;">
    <div class="authHint" id="bgUploadStatus"></div>
  </div>

  <div class="field"><label>Users</label></div>
  <div id="adminUserList"></div>

  <div class="field" style="margin-top:24px;"><label>Usage</label></div>
  <div id="adminUsageList"><div class="authHint">Loading…</div></div>

  <button class="secondaryBtn" id="signOutBtn" style="margin-top:24px;">Sign out</button>
</div>

<script>
  // If admin.js fails to load or throws before it can render anything,
  // don't leave the screen blank — show something.
  window.addEventListener('error', (e) => {
    const boot = document.getElementById('authBoot');
    if (boot && !boot.classList.contains('hidden')) {
      boot.innerHTML = `<div style="text-align:center; padding:0 24px; color:#ffb199; font-size:13px;">Script error: ${e.message}</div>`;
    }
  });
</script>
<script type="module" src="admin.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {}));
  }
</script>
</body>
</html>
