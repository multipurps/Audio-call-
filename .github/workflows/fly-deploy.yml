name: Deploy to Fly.io

# Manual only: Actions tab -> "Deploy to Fly.io" -> Run workflow.
# Needs the FLY_API_TOKEN repo secret (Fly organization slug: personal).
# Deploys the Wacalls app from the repo root (fly.toml). Creates the Fly app in the org on the first run.
on:
  workflow_dispatch:
    inputs:
      dir:
        description: Folder with the fly.toml to deploy (repo root = the Wacalls app)
        default: "."
        required: true

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app in the Fly organization if it does not exist
        working-directory: ${{ inputs.dir }}
        run: |
          APP=$(grep -m1 '^app' fly.toml | cut -d'"' -f2)
          echo "App: $APP"
          ORGS=$(flyctl orgs list 2>&1) || true
          echo "$ORGS"
          if flyctl status --app "$APP" >/dev/null 2>&1; then echo "App $APP already exists"; exit 0; fi
          set +e
          OUT=$(flyctl apps create "$APP" --org personal 2>&1); CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            echo "::error title=Fly app create failed::$(echo "$OUT" | tr '\n' ' ' | cut -c1-600) | orgs: $(echo "$ORGS" | tr '\n' ' ' | cut -c1-300)"
            exit 1
          fi
      - run: flyctl deploy --remote-only
        working-directory: ${{ inputs.dir }}
